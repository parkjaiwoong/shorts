version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd marketing && npm ci && npm run build
    build:
      commands:
        - echo "Build completed in preBuild"
  artifacts:
    baseDirectory: marketing/.next
    files:
      - '**/*'
  cache:
    paths:
      - marketing/node_modules/**/*
      - marketing/.next/cache/**/*
